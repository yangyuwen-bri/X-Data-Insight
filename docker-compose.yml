
version: '3.8'

services:
  backend:
    build: 
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: xdata-backend
    ports:
      - "8000:8000"
    env_file:
      - ./app/backend/.env
    volumes:
      - ./data:/app/data
      - ./charts:/app/static/charts
    restart: always

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: xdata-frontend
    ports:
      - "3000:3000"
    environment:
      # Production Public IP Configuration
      - NEXT_PUBLIC_API_URL=http://139.224.61.205:8000/api
    restart: always
